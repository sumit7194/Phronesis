<title>Curvature × J-space review</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#22201b;--mut:#6b6862;--line:#e5e2d9;--accent:#534ab7;--amber:#8a5a00;--ambg:#faeeda;--gray:#eee;--tealbg:#e1f5ee;--teal:#0f6e56;--redbg:#fcebeb;--red:#a32d2d}
@media(prefers-color-scheme:dark){:root{--bg:#1a1916;--card:#232019;--ink:#ece8df;--mut:#a5a29a;--line:#3a3730;--accent:#afa9ec;--amber:#fac775;--ambg:#3a2c10;--gray:#2c2c2a;--tealbg:#0c3329;--teal:#5dcaa5;--redbg:#3a1414;--red:#f09595}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{display:flex;min-height:100vh}
.side{width:290px;flex:none;border-right:1px solid var(--line);padding:16px;overflow-y:auto;height:100vh;position:sticky;top:0}
.main{flex:1;padding:20px 26px;max-width:1000px}
h1{font-size:17px;margin:0 0 4px}.sub{color:var(--mut);font-size:12.5px;margin:0 0 16px}
.pbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;margin:0 0 7px;cursor:pointer;font-size:13px}
.pbtn.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pbtn b{display:block;font-size:13.5px}.pbtn span{color:var(--mut);font-size:11.5px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 16px}
.qbox .q{font-size:13.5px}.qbox .a{margin-top:6px;font-size:12.5px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;margin-left:6px}
.tag.wrong{background:var(--redbg);color:var(--red)}.tag.ok{background:var(--tealbg);color:var(--teal)}
.postrip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.pos{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.pos.on{border-color:var(--accent);background:var(--accent);color:#fff}
.cols{display:grid;grid-template-columns:1fr 1.55fr;gap:18px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h3{margin:0 0 3px;font-size:13.5px}.panel .h3s{color:var(--mut);font-size:11.5px;margin:0 0 10px}
.lyr{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.wsrow{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px dotted var(--line)}
.wsrow span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 7px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-family:ui-monospace,Menlo,monospace}
th{color:var(--mut);font-weight:500;font-size:11px;cursor:help}
tr.null td{background:var(--ambg)}tr.rand td{color:var(--mut);font-style:italic}
.chip{font-size:10px;padding:0 5px;border-radius:10px;background:var(--gray);color:var(--mut);margin-left:5px}
.inws{color:var(--teal);font-weight:500}
.note{font-size:12px;color:var(--mut);margin:14px 0 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.legend{font-size:11.5px;color:var(--mut);margin-top:8px}.legend b{color:var(--ink)}
